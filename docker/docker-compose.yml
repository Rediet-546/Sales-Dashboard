version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dashboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dashboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: dashboard-api
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/dashboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: 5000
      NODE_ENV: development
      WS_PORT: 8080
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app
      - /app/node_modules
    networks:
      - dashboard-network
    command: npm run dev

  # WebSocket Server
  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile.websocket
    container_name: dashboard-websocket
    environment:
      PORT: 8080
      NODE_ENV: development
    ports:
      - "8081:8080"
    depends_on:
      - api
    volumes:
      - ../apps/websocket-server:/app
      - /app/node_modules
    networks:
      - dashboard-network
    command: npm run dev

  # Frontend
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: dashboard-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_APP_NAME: Sales Dashboard
      API_REWRITE_TARGET: http://api:5000/api/:path*
    ports:
      - "3000:3000"
    depends_on:
      - api
      - websocket
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - dashboard-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  dashboard-network:
    driver: bridge